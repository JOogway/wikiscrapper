spring.application.name=wikiscrapper
server.port=8080
spring.threads.virtual.enabled=true

# SQL Server Express (SQLEXPRESS) over TCP — same instance as the .NET app, separate database (WikiScrapperJava).
# Tools/SSMS: localhost\SQLEXPRESS  |  JDBC needs explicit TCP port (SQL Browser is often stopped).
# If connection fails after a restart, re-read TcpDynamicPorts under MSSQL17.SQLEXPRESS in the registry.
spring.datasource.url=jdbc:sqlserver://localhost:63171;databaseName=WikiScrapperJava;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Sync persists in transactions of 25 saves; JDBC batching turns each into one round-trip.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_updates=true

spring.mvc.problemdetails.enabled=true

wikipedia.en-base-url=https://en.wikipedia.org/api/rest_v1/
wikipedia.pl-base-url=https://pl.wikipedia.org/api/rest_v1/
wikipedia.max-concurrency=8

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.boot.autoconfigure=WARN
