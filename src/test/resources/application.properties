spring.datasource.url=jdbc:h2:mem:wikiscrapper;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
wikipedia.en-base-url=https://en.wikipedia.org/api/rest_v1/
wikipedia.pl-base-url=https://pl.wikipedia.org/api/rest_v1/
wikipedia.max-concurrency=8
logging.level.root=WARN
